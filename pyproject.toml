[project]
name = "memfof"
version = "2025.8.30"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.8.1",
  "gradio>=5.44.1",
  "h5py>=3.14.0",
  "huggingface-hub>=0.34.4",
  "ipykernel>=6.30.1",
  "lightning>=2.5.4",
  "opencv-python-headless>=4.12.0.88",
  "safetensors>=0.6.2",
  "scipy>=1.15.3",
  "spaces>=0.40.1",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "wandb>=0.21.2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["memfof", "memfof.utils"]
